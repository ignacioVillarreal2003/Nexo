layout.footer=Nexo — este es un mensaje automático, por favor no respondas.
layout.preferences=Administrar tus preferencias de notificación

security.email-verification.subject=Verificá tu dirección de email
security.email-verification.body=<p>Hola {name}:</p>\
  <p>¡Bienvenido a Nexo! Confirmá tu dirección de email haciendo clic en el enlace de abajo:</p>\
  <p><a href="{link}">Verificar mi email</a></p>\
  <p>El enlace vence en {ttlHours} horas. Si no creaste una cuenta, podés ignorar este mensaje.</p>

security.password-reset.subject=Restablecé tu contraseña
security.password-reset.body=<p>Hola {name}:</p>\
  <p>Recibimos un pedido para restablecer tu contraseña. Hacé clic en el enlace de abajo para elegir una nueva:</p>\
  <p><a href="{link}">Restablecer mi contraseña</a></p>\
  <p>El enlace vence en {ttlMinutes} minutos. Si no pediste el cambio, podés ignorar este mensaje.</p>

security.password-changed.subject=Se cambió tu contraseña
security.password-changed.body=<p>Hola {name}:</p>\
  <p>Se acaba de cambiar la contraseña de tu cuenta de Nexo. Si fuiste vos, no hace falta que hagas nada.</p>\
  <p>Si no la cambiaste, restablecela de inmediato y contactá a soporte.</p>

delivery.daily-digest.subject=Tu día en Nexo: {count} noticias nuevas
delivery.daily-digest.read-more=Leer la nota original
delivery.daily-digest.key-points=Lo clave
delivery.daily-digest.why-it-matters=Por qué importa:
delivery.daily-digest.reading-time={minutes} min de lectura
delivery.daily-digest.update=Actualización
delivery.daily-digest.inapp-title=Tenés {count} noticias nuevas en tu día
delivery.daily-digest.greeting=Hola:
delivery.daily-digest.greeting-named=Hola, {name}:
delivery.daily-digest.body=<p>{greeting}</p>\
  <p>Tu selección del {day} está lista: <strong>{count}</strong> noticias nuevas sobre los temas que seguís, cada \
  una resumida completa para que te pongas al día sin salir del correo.</p>\
  {itemsBlock}\
  <p><a href="{link}">Abrir Mi día</a></p>

generic.notification.subject={title}
generic.notification.default-title=Tenés una notificación nueva
generic.notification.body=<p>Hola {name}:</p>\
  <p><strong>{title}</strong></p>\
  <p>{body}</p>\
  <p><a href="{link}">Abrir Nexo</a></p>
