layout.footer=Nexo — this is an automated message, please do not reply.
layout.preferences=Manage your notification preferences

security.email-verification.subject=Verify your email address
security.email-verification.body=<p>Hi {name},</p>\
  <p>Welcome to Nexo! Please confirm your email address by clicking the link below:</p>\
  <p><a href="{link}">Verify my email</a></p>\
  <p>This link expires in {ttlHours} hours. If you did not create an account, you can ignore this message.</p>

security.password-reset.subject=Reset your password
security.password-reset.body=<p>Hi {name},</p>\
  <p>We received a request to reset your password. Click the link below to choose a new one:</p>\
  <p><a href="{link}">Reset my password</a></p>\
  <p>This link expires in {ttlMinutes} minutes. If you did not request a reset, you can ignore this message.</p>

security.password-changed.subject=Your password was changed
security.password-changed.body=<p>Hi {name},</p>\
  <p>Your Nexo account password was just changed. If this was you, no action is needed.</p>\
  <p>If you did not change your password, reset it immediately and contact support.</p>

delivery.daily-digest.subject=Your day on Nexo: {count} new stories
delivery.daily-digest.read-more=Read the original article
delivery.daily-digest.key-points=Key points
delivery.daily-digest.why-it-matters=Why it matters:
delivery.daily-digest.reading-time={minutes} min read
delivery.daily-digest.update=Update
delivery.daily-digest.inapp-title={count} new items in your day
delivery.daily-digest.greeting=Hi,
delivery.daily-digest.greeting-named=Hi {name},
delivery.daily-digest.body=<p>{greeting}</p>\
  <p>Your selection for {day} is ready: <strong>{count}</strong> new stories about the topics you follow, each one \
  summarized in full so you can catch up without leaving your inbox.</p>\
  {itemsBlock}\
  <p><a href="{link}">Open My day</a></p>

generic.notification.subject={title}
generic.notification.default-title=You have a new notification
generic.notification.body=<p>Hi {name},</p>\
  <p><strong>{title}</strong></p>\
  <p>{body}</p>\
  <p><a href="{link}">Open Nexo</a></p>
