spring:
  application:
    name: content
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/nexo_content}
    username: ${DB_USERNAME:nexo}
    password: ${DB_PASSWORD:nexo}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29093}
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: content
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

  threads:
    virtual:
      enabled: true

  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:2}

  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

server:
  port: ${SERVER_PORT:8094}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024
  error:
    include-stacktrace: never
    include-message: never

nexo:
  security:
    jwt:
      json-web-key-set-uri: ${JWT_JSON_WEB_KEY_SET_URI:}
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:nexo-authentication}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4300}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: "*"
      exposed-headers: X-Request-Id
      allow-credentials: true
      max-age: 3600
  collected:
    topic: ${CONTENT_COLLECTED_TOPIC:nexo.content.collected}
    dead-letter-topic: ${CONTENT_COLLECTED_DEAD_LETTER_TOPIC:nexo.content.collected.dlt}
    partitions: ${CONTENT_COLLECTED_PARTITIONS:6}
    replicas: ${KAFKA_TOPIC_REPLICAS:1}
    concurrency: ${CONTENT_COLLECTED_CONCURRENCY:3}
  authentication-service:
    # Cliente de servicio (client_credentials) con el que este servicio llama a los demás.
    base-url: ${AUTHENTICATION_SERVICE_BASE_URL:http://localhost:8090}
    client-id: ${AUTHENTICATION_SERVICE_CLIENT_ID:c0000000-0000-0000-0000-000000000002}
    client-secret: ${AUTHENTICATION_SERVICE_CLIENT_SECRET:nexo-content-dev-secret}
    timeout: ${AUTHENTICATION_SERVICE_TIMEOUT:5s}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8096}
    timeout: ${AI_SERVICE_TIMEOUT:90s}
  deduplication:
    # Similitud coseno a partir de la cual dos contenidos son el mismo.
    semantic-duplicate-threshold: ${SEMANTIC_DUPLICATE_THRESHOLD:0.92}
    # Zona gris: la IA decide si es duplicado, actualización o información nueva.
    semantic-related-threshold: ${SEMANTIC_RELATED_THRESHOLD:0.80}
    simhash-maximum-distance: 3
    window: 14d
    minimum-quality: 0.30
  candidates:
    window: 7d
  runs:
    stale-after: 6h
  briefs:
    per-run: ${BRIEFS_PER_RUN:6}
    maximum-attempts: ${BRIEFS_MAXIMUM_ATTEMPTS:5}
    fallback-after: ${BRIEFS_FALLBACK_AFTER:10m}
  monitoring:
    username: ${MONITORING_USERNAME:prometheus}
    password: ${MONITORING_PASSWORD:prometheus}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${TRACING_ENABLED:false}

resilience4j:
  retry:
    instances:
      ai-service:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
      authentication-service:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  circuitbreaker:
    instances:
      ai-service:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 30s
        wait-duration-in-open-state: 30s
      authentication-service:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 30s
        wait-duration-in-open-state: 30s

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.nexo: INFO
