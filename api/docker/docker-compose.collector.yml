name: nexo-collector

services:
  collector-api:
    build: ../collector
    container_name: nexo-collector-api
    restart: unless-stopped
    ports:
      - "8097:8097"
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4300}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-nexo-kafka:9092}
      CONTENT_COLLECTED_TOPIC: ${CONTENT_COLLECTED_TOPIC:-nexo.content.collected}
      AUTHENTICATION_SERVICE_BASE_URL: http://nexo-authentication-api:8090
      AUTHENTICATION_SERVICE_CLIENT_ID: ${COLLECTOR_SERVICE_CLIENT_ID:-c0000000-0000-0000-0000-000000000001}
      AUTHENTICATION_SERVICE_CLIENT_SECRET: ${COLLECTOR_SERVICE_CLIENT_SECRET:-nexo-collector-dev-secret}
      TOPIC_SERVICE_BASE_URL: http://nexo-topic-api:8092
      SUBSCRIPTION_SERVICE_BASE_URL: http://nexo-subscription-api:8093
      CONTENT_SERVICE_BASE_URL: http://nexo-content-api:8094
      JWKS_URL: http://nexo-authentication-api:8090/.well-known/json-web-key-set.json
      JWT_ISSUER: ${JWT_ISSUER:-nexo-authentication}
      COLLECT_CRON: ${COLLECT_CRON:-0 3 * * *}
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8097/actuator/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - nexo

networks:
  nexo:
    external: true
