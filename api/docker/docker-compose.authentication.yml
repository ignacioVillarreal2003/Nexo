name: nexo-authentication

services:
  authentication-api:
    image: ${AUTHENTICATION_IMAGE:-nexo-authentication:local}
    build: ../authentication
    container_name: nexo-authentication-api
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - path: ../authentication/.env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Inicio de sesión con Google: el ID de cliente de OAuth (Google Cloud → Credenciales). Vacío = deshabilitado.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-changeme}
      SERVER_PORT: "8090"
      DB_URL: jdbc:postgresql://${POSTGRES_HOST:-nexo-postgres}:${POSTGRES_PORT:-5432}/${AUTHENTICATION_DB:-nexo_authentication}
      DB_USERNAME: ${POSTGRES_USER:-nexo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nexo}
      REDIS_HOST: ${REDIS_HOST:-nexo-redis}
      REDIS_PORT: "${REDIS_PORT:-6379}"
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-nexo-kafka:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_TOPIC_REPLICAS: "${KAFKA_TOPIC_REPLICAS:-1}"
      USER_EVENTS_ENABLED: ${USER_EVENTS_ENABLED:-true}
      USER_EVENTS_TOPIC: ${USER_EVENTS_TOPIC:-nexo.authentication.user-events}
      USER_EVENTS_PARTITIONS: "${USER_EVENTS_PARTITIONS:-3}"
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
      NOTIFICATION_COMMANDS_TOPIC: ${NOTIFICATION_COMMANDS_TOPIC:-nexo.notifications.commands}
      JWT_ISSUER: ${JWT_ISSUER:-nexo-authentication}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4300}
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-http://nexo-tempo:4318/v1/traces}
      MONITORING_USERNAME: ${MONITORING_USERNAME:-prometheus}
      MONITORING_PASSWORD: ${MONITORING_PASSWORD:-prometheus}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nexo.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      OAUTH2_AUTHORIZED_REDIRECT_URIS: ${OAUTH2_AUTHORIZED_REDIRECT_URIS:-http://localhost:4300/oauth2/callback}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M
        reservations:
          memory: 512M
    networks:
      - nexo

networks:
  nexo:
    external: true
