name: nexo-ai

services:
  ai-api:
    build: ../ai
    container_name: nexo-ai-api
    restart: unless-stopped
    ports:
      - "8096:8096"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      LLM_REQUESTS_PER_MINUTE: "${LLM_REQUESTS_PER_MINUTE:-10}"
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      SUMMARY_LANGUAGE: ${SUMMARY_LANGUAGE:-es}
      JWKS_URL: http://nexo-authentication-api:8090/.well-known/json-web-key-set.json
      JWT_ISSUER: ${JWT_ISSUER:-nexo-authentication}
      HF_HOME: /models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8096/actuator/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          memory: 1024M
    networks:
      - nexo
    volumes:
      - ai-models:/models

volumes:
  ai-models:

networks:
  nexo:
    external: true
