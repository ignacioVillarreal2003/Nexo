name: nexo-notification

services:
  notification-api:
    build: ../notification
    container_name: nexo-notification-api
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: "8091"
      DB_URL: jdbc:postgresql://${POSTGRES_HOST:-nexo-postgres}:${POSTGRES_PORT:-5432}/${NOTIFICATION_DB:-nexo_notification}
      DB_USERNAME: ${POSTGRES_USER:-nexo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nexo}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-nexo-kafka:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_TOPIC_REPLICAS: "${KAFKA_TOPIC_REPLICAS:-1}"
      JWT_JSON_WEB_KEY_SET_URI: ${JWT_JSON_WEB_KEY_SET_URI:-http://nexo-authentication-api:8090/.well-known/json-web-key-set.json}
      JWT_ISSUER: ${JWT_ISSUER:-nexo-authentication}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4300}
      OTLP_TRACING_ENDPOINT: ${OTLP_TRACING_ENDPOINT:-http://nexo-tempo:4318/v1/traces}
      TRACING_SAMPLING_PROBABILITY: "${TRACING_SAMPLING_PROBABILITY:-0.1}"
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      MONITORING_USERNAME: ${MONITORING_USERNAME:-prometheus}
      MONITORING_PASSWORD: ${MONITORING_PASSWORD:-prometheus}
      REDIS_HOST: ${REDIS_HOST:-nexo-redis}
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_SSL: "${REDIS_SSL:-false}"
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: "${MAIL_PORT:-587}"
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      EMAIL_FROM: ${EMAIL_FROM:-${MAIL_USERNAME:-no-reply@nexo.local}}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: "${MAIL_SMTP_AUTH:-true}"
      MAIL_SMTP_STARTTLS: "${MAIL_SMTP_STARTTLS:-true}"
      NOTIFICATION_COMMANDS_TOPIC: ${NOTIFICATION_COMMANDS_TOPIC:-nexo.notifications.commands}
      NOTIFICATION_COMMANDS_CONCURRENCY: "${NOTIFICATION_COMMANDS_CONCURRENCY:-3}"
      USER_EVENTS_TOPIC: ${USER_EVENTS_TOPIC:-nexo.authentication.user-events}
      USER_EVENTS_DEAD_LETTER_TOPIC: ${USER_EVENTS_DEAD_LETTER_TOPIC:-nexo.authentication.user-events.dlt}
      USER_EVENTS_CONCURRENCY: "${USER_EVENTS_CONCURRENCY:-2}"
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:4300}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          memory: 384M
    networks:
      - nexo

networks:
  nexo:
    external: true
