name: nexo-content

services:
  content-api:
    build: ../content
    container_name: nexo-content-api
    restart: unless-stopped
    ports:
      - "8094:8094"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: "8094"
      DB_URL: jdbc:postgresql://${POSTGRES_HOST:-nexo-postgres}:${POSTGRES_PORT:-5432}/${CONTENT_DB:-nexo_content}
      DB_USERNAME: ${POSTGRES_USER:-nexo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nexo}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-nexo-kafka:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_TOPIC_REPLICAS: "${KAFKA_TOPIC_REPLICAS:-1}"
      JWT_JSON_WEB_KEY_SET_URI: ${JWT_JSON_WEB_KEY_SET_URI:-http://nexo-authentication-api:8090/.well-known/json-web-key-set.json}
      JWT_ISSUER: ${JWT_ISSUER:-nexo-authentication}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4300}
      OTLP_TRACING_ENDPOINT: ${OTLP_TRACING_ENDPOINT:-http://nexo-tempo:4318/v1/traces}
      TRACING_SAMPLING_PROBABILITY: "${TRACING_SAMPLING_PROBABILITY:-0.1}"
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      MONITORING_USERNAME: ${MONITORING_USERNAME:-prometheus}
      MONITORING_PASSWORD: ${MONITORING_PASSWORD:-prometheus}
      AUTHENTICATION_SERVICE_BASE_URL: http://nexo-authentication-api:8090
      AUTHENTICATION_SERVICE_CLIENT_ID: ${CONTENT_SERVICE_CLIENT_ID:-c0000000-0000-0000-0000-000000000002}
      AUTHENTICATION_SERVICE_CLIENT_SECRET: ${CONTENT_SERVICE_CLIENT_SECRET:-nexo-content-dev-secret}
      AI_SERVICE_BASE_URL: http://nexo-ai-api:8096
      CONTENT_COLLECTED_TOPIC: ${CONTENT_COLLECTED_TOPIC:-nexo.content.collected}
      SEMANTIC_DUPLICATE_THRESHOLD: "${SEMANTIC_DUPLICATE_THRESHOLD:-0.92}"
      SEMANTIC_RELATED_THRESHOLD: "${SEMANTIC_RELATED_THRESHOLD:-0.80}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8094/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          memory: 384M
    networks:
      - nexo

networks:
  nexo:
    external: true
